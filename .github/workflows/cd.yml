name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Setup the environment for Docker build
        run: ./scripts/buildprod.sh

      - name: Build the app Docker image locally
        run: docker build -t frkirc/notely:latest . --platform=linux/arm64

      - name: Run the app via Docker image locally
        run: docker run -e PORT=8080 -p 8080:8080 frkirc/notely:latest
